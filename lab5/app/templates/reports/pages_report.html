{% extends "base.html" %}

{% block title %}Pages Report{% endblock %}

{% block content %}
<h1>Pages Report</h1>

<table class="table">
    <thead>
        <tr>
            <th>№</th>
            <th>Страница</th>
            <th>Количество посещений</th>
        </tr>
    </thead>
    <tbody>
        {% for path, count in stats %}
        <tr>
            <td>{{ loop.index }}</td>
            <td>{{ path }}</td>
            <td>{{ count }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>

<div class="mt-3">
    <a href="{{ url_for('reports.export_pages_csv') }}" class="btn btn-success">Экспорт в CSV</a>
    <a href="{{ url_for('reports.visit_logs') }}" class="btn btn-info">Visit Logs</a>
    <a href="{{ url_for('reports.users_report') }}" class="btn btn-warning">Users Report</a>
    <a href="{{ url_for('main.index') }}" class="btn btn-secondary">Back to Home</a>
</div>
{% endblock %}
